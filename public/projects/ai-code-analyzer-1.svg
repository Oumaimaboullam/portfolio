<text x="340" y="180" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="15" font-weight="400" fill="#22d3ee" text-anchor="start">def moyenne(notes):</text>
<text x="318" y="210" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="13" font-weight="400" fill="#858ca6" text-anchor="end" opacity="0.5">2</text>
<text x="340" y="210" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="15" font-weight="400" fill="#e8eaf6" text-anchor="start">    total = 0</text>
<text x="318" y="240" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="13" font-weight="400" fill="#858ca6" text-anchor="end" opacity="0.5">3</text>
<text x="340" y="240" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="15" font-weight="400" fill="#e8eaf6" text-anchor="start">    for i in range(len(notes)):</text>
<text x="318" y="270" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="13" font-weight="400" fill="#858ca6" text-anchor="end" opacity="0.5">4</text>
<text x="340" y="270" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="15" font-weight="400" fill="#e8eaf6" text-anchor="start">        total += notes[i]</text>
<text x="318" y="300" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="13" font-weight="400" fill="#858ca6" text-anchor="end" opacity="0.5">5</text>
<text x="340" y="300" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="15" font-weight="400" fill="#e8eaf6" text-anchor="start">    return total / len(notes)</text>
<text x="318" y="330" xml:space="preserve" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="13" font-weight="400" fill="#858ca6" text-anchor="end" opacity="0.5">6</text>
